modLoader="kotlinforforge"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ldlib2"
type="required"
versionRange="${ldlib2_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="fzzy_config"
type="required"
versionRange="${fzzy_config_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="required"
versionRange="${curios_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="silentgear"
type="optional"
versionRange="${silent_gear_version_range}"
ordering="AFTER"
side="BOTH"
reason="Restores Silent Gear state after repairs"

[modproperties.fzzy_config]
fzzy_config="${mod_id}"
