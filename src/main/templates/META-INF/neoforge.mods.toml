modLoader="kotlinforforge"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ldlib2"
type="required"
versionRange="${ldlib2_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="fzzy_config"
type="required"
versionRange="${fzzy_config_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="${curios_version_range}"
ordering="AFTER"
side="BOTH"
reason="Enables the teleporter equipment slot and activation key"

[[dependencies.${mod_id}]]
modId="silentgear"
type="optional"
versionRange="${silent_gear_version_range}"
ordering="AFTER"
side="BOTH"
reason="Restores Silent Gear state after repairs"

[[dependencies.${mod_id}]]
modId="beyonddimensions"
type="optional"
versionRange="${beyond_dimensions_version_range}"
ordering="AFTER"
side="BOTH"
reason="Enables direct item, fluid, and energy transfer to dimensional networks"

[[dependencies.${mod_id}]]
modId="botanypots"
type="optional"
versionRange="${botany_pots_version_range}"
ordering="AFTER"
side="BOTH"
reason="Enables the Planter integration machine"

[[dependencies.${mod_id}]]
modId="botanypotstiers"
type="optional"
versionRange="${botany_pots_tiers_version_range}"
ordering="AFTER"
side="BOTH"
reason="Enables tiered Botany Pot multipliers in the Planter"

[modproperties.fzzy_config]
fzzy_config="${mod_id}"
