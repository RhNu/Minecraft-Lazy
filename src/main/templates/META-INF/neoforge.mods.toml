modLoader="kotlinforforge"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="lazy.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ldlib2"
type="required"
versionRange="${ldlib2_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="fzzy_config"
type="required"
versionRange="${fzzy_config_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="${curios_version_range}"
ordering="AFTER"
side="BOTH"
reason="Enables the teleporter equipment slot, activation key, and configuration card equipment slot"

[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="${jade_version_range}"
ordering="AFTER"
side="BOTH"
reason="Shows Lazy machine status in the Jade overlay"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="${jei_version_range}"
ordering="AFTER"
side="CLIENT"
reason="Displays simulation chamber recipes"

[[dependencies.${mod_id}]]
modId="kubejs"
type="optional"
versionRange="${kubejs_version_range}"
ordering="AFTER"
side="BOTH"
reason="Enables scripted simulation chamber recipes"

[[dependencies.${mod_id}]]
modId="silentgear"
type="optional"
versionRange="${silent_gear_version_range}"
ordering="AFTER"
side="BOTH"
reason="Restores Silent Gear state after repairs"

[[dependencies.${mod_id}]]
modId="beyonddimensions"
type="optional"
versionRange="${beyond_dimensions_version_range}"
ordering="AFTER"
side="BOTH"
reason="Enables direct item, fluid, and energy transfer to dimensional networks"

[[dependencies.${mod_id}]]
modId="mysticalagriculture"
type="optional"
versionRange="${mystical_agriculture_version_range}"
ordering="AFTER"
side="BOTH"
reason="Enables the Essence Converter integration machine"

[[dependencies.${mod_id}]]
modId="mysticalagradditions"
type="optional"
versionRange="${mystical_agradditions_version_range}"
ordering="AFTER"
side="BOTH"
reason="Adds Insanium support to the Essence Converter"

[[dependencies.${mod_id}]]
modId="ae2"
type="optional"
versionRange="${ae2_version_range}"
ordering="AFTER"
side="BOTH"
reason="Enables direct item and fluid output to ME networks"

[[dependencies.${mod_id}]]
modId="appflux"
type="optional"
versionRange="${applied_flux_version_range}"
ordering="AFTER"
side="BOTH"
reason="Enables Forge Energy output into Applied Flux ME storage"

[[dependencies.${mod_id}]]
modId="guideme"
type="optional"
versionRange="${guideme_version_range}"
ordering="AFTER"
side="BOTH"
reason="Provides the guide framework used by the tested AE2 integration stack"

[[dependencies.${mod_id}]]
modId="glodium"
type="optional"
versionRange="${glodium_version_range}"
ordering="AFTER"
side="BOTH"
reason="Provides the shared runtime required by Applied Flux"

[modproperties.fzzy_config]
fzzy_config="${mod_id}"
