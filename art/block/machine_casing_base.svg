<svg xmlns="http://www.w3.org/2000/svg"
     width="16"
     height="16"
     viewBox="0 0 16 16"
     shape-rendering="crispEdges">
  <!-- Neutral machine casing, authored on the 16x16 pixel grid. -->
  <rect width="16" height="16" fill="#41494d"/>

  <!--
    Outer frame with matching opposite rails. Cube-face lighting already supplies
    direction, so the texture keeps the top/bottom and left/right rails equally bright.
  -->
  <rect x="1" y="1" width="14" height="14" fill="#586268"/>
  <rect x="1" y="1" width="14" height="1" fill="#6b767a"/>
  <rect x="1" y="2" width="1" height="13" fill="#626d71"/>
  <rect x="2" y="14" width="13" height="1" fill="#6b767a"/>
  <rect x="14" y="2" width="1" height="12" fill="#626d71"/>
  <rect x="2" y="0" width="12" height="1" fill="#5f696d"/>
  <rect x="0" y="2" width="1" height="12" fill="#596367"/>
  <rect x="2" y="15" width="12" height="1" fill="#5f696d"/>
  <rect x="15" y="2" width="1" height="12" fill="#596367"/>

  <!-- Recessed center plate uses the same non-directional bright-rim rule. -->
  <rect x="2" y="2" width="12" height="12" fill="#4c565b"/>
  <rect x="2" y="2" width="12" height="1" fill="#626d71"/>
  <rect x="2" y="3" width="1" height="11" fill="#5d686c"/>
  <rect x="3" y="13" width="11" height="1" fill="#626d71"/>
  <rect x="13" y="3" width="1" height="10" fill="#5d686c"/>
  <rect x="3" y="3" width="10" height="10" fill="#566166"/>

  <!-- Sparse brushed-metal marks; the center remains quiet for overlays. -->
  <rect x="4" y="4" width="3" height="1" fill="#5b666a"/>
  <rect x="9" y="4" width="2" height="1" fill="#4d575c"/>
  <rect x="3" y="6" width="2" height="1" fill="#4b555a"/>
  <rect x="10" y="6" width="3" height="1" fill="#596469"/>
  <rect x="3" y="10" width="3" height="1" fill="#5a656a"/>
  <rect x="10" y="11" width="3" height="1" fill="#4a5459"/>
  <rect x="6" y="12" width="2" height="1" fill="#5e696d"/>

  <!-- Fasteners share one light value so diagonal corners do not fight cube lighting. -->
  <rect x="2" y="2" width="1" height="1" fill="#929c9f"/>
  <rect x="13" y="2" width="1" height="1" fill="#929c9f"/>
  <rect x="2" y="13" width="1" height="1" fill="#929c9f"/>
  <rect x="13" y="13" width="1" height="1" fill="#929c9f"/>
</svg>
