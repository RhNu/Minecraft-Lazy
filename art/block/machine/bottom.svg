<svg xmlns="http://www.w3.org/2000/svg"
    width="16"
    height="16"
    viewBox="0 0 16 16"
    shape-rendering="crispEdges">
    <!-- Shared machine casing: three-tone structure without fake shadowing. -->
    <rect width="16" height="16" fill="#3b4347" />

    <!-- Side face: two layers, with a clean light/dark split. -->
    <rect x="1" y="1" width="14" height="14" fill="#495257" />
    <rect x="1" y="1" width="14" height="1" fill="#6f7a7f" />
    <rect x="1" y="2" width="1" height="12" fill="#5f696d" />
    <rect x="2" y="14" width="13" height="1" fill="#6f7a7f" />
    <rect x="14" y="2" width="1" height="12" fill="#5f696d" />

    <!-- Inner plate keeps the center available for overlays. -->
    <rect x="2" y="2" width="12" height="12" fill="#50595e" />
    <rect x="2" y="2" width="12" height="1" fill="#6b767b" />
    <rect x="2" y="3" width="1" height="11" fill="#636e72" />
    <rect x="3" y="13" width="11" height="1" fill="#5b6569" />
    <rect x="13" y="3" width="1" height="10" fill="#4b5559" />

    <!-- Sparse metal marks, kept subtle and planar. -->
    <rect x="4" y="4" width="2" height="1" fill="#616b70" />
    <rect x="9" y="4" width="2" height="1" fill="#444d52" />
    <rect x="3" y="6" width="3" height="1" fill="#4a5458" />
    <rect x="9" y="6" width="4" height="1" fill="#5d676b" />
    <rect x="4" y="10" width="3" height="1" fill="#5b6569" />
    <rect x="9" y="11" width="3" height="1" fill="#434d51" />

    <!-- Rivets are a single highlight value, not pseudo-shadow. -->
    <rect x="2" y="2" width="1" height="1" fill="#97a0a3" />
    <rect x="13" y="2" width="1" height="1" fill="#97a0a3" />
    <rect x="2" y="13" width="1" height="1" fill="#97a0a3" />
    <rect x="13" y="13" width="1" height="1" fill="#97a0a3" />
</svg>