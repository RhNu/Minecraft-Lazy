<svg xmlns="http://www.w3.org/2000/svg"
    width="16"
    height="16"
    viewBox="0 0 16 16"
    shape-rendering="crispEdges">
    <!-- Full side casing texture: opaque 16x16 with top-bright / bottom-dark split. -->
    <rect width="16" height="16" fill="#3a4246" />

    <rect x="1" y="1" width="14" height="14" fill="#495257" />
    <rect x="1" y="1" width="14" height="1" fill="#6f7a7f" />
    <rect x="1" y="2" width="1" height="12" fill="#5f696d" />
    <rect x="2" y="14" width="13" height="1" fill="#6f7a7f" />
    <rect x="14" y="2" width="1" height="12" fill="#5f696d" />

    <rect x="2" y="2" width="12" height="12" fill="#555f64" />
    <rect x="2" y="2" width="12" height="1" fill="#727d82" />
    <rect x="2" y="3" width="1" height="11" fill="#657075" />
    <rect x="3" y="13" width="11" height="1" fill="#596367" />
    <rect x="13" y="3" width="1" height="10" fill="#657075" />

    <!-- Horizontal split: upper panel brighter, lower panel darker. -->
    <rect x="3" y="3" width="10" height="5" fill="#646e73" />
    <rect x="3" y="8" width="10" height="5" fill="#4f595e" />
    <rect x="3" y="8" width="10" height="1" fill="#6d777c" />

    <rect x="4" y="5" width="3" height="1" fill="#6b757a" />
    <rect x="9" y="5" width="3" height="1" fill="#566065" />
    <rect x="4" y="10" width="3" height="1" fill="#4a5458" />
    <rect x="9" y="11" width="3" height="1" fill="#5a6468" />

    <rect x="2" y="2" width="1" height="1" fill="#97a0a3" />
    <rect x="13" y="2" width="1" height="1" fill="#97a0a3" />
    <rect x="2" y="13" width="1" height="1" fill="#97a0a3" />
    <rect x="13" y="13" width="1" height="1" fill="#97a0a3" />
</svg>