<svg xmlns="http://www.w3.org/2000/svg"
    width="16"
    height="16"
    viewBox="0 0 16 16"
    shape-rendering="crispEdges">
    <!-- Full top casing texture: opaque 16x16 with one dark frame and a soft bright plate. -->
    <rect width="16" height="16" fill="#41494d" />

    <!-- Single dark frame that stays consistent with other casing textures. -->
    <rect x="1" y="1" width="14" height="14" fill="#4b555a" />

    <!-- Inner bright plate, moderated brightness (not near-white). -->
    <rect x="2" y="2" width="12" height="12" fill="#8b979d" />
    <rect x="2" y="2" width="12" height="1" fill="#a5b1b6" />
    <rect x="2" y="3" width="1" height="11" fill="#99a5ab" />
    <rect x="3" y="13" width="11" height="1" fill="#768287" />
    <rect x="13" y="3" width="1" height="10" fill="#727e84" />

    <rect x="4" y="4" width="8" height="1" fill="#b4c0c5" />
    <rect x="4" y="5" width="8" height="5" fill="#97a3a9" />
    <rect x="5" y="10" width="6" height="2" fill="#88949a" />

    <rect x="2" y="2" width="1" height="1" fill="#b3bfc4" />
    <rect x="13" y="2" width="1" height="1" fill="#b3bfc4" />
    <rect x="2" y="13" width="1" height="1" fill="#6d797f" />
    <rect x="13" y="13" width="1" height="1" fill="#6d797f" />
</svg>