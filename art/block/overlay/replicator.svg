<svg xmlns="http://www.w3.org/2000/svg"
    width="16"
    height="16"
    viewBox="0 0 16 16"
    shape-rendering="crispEdges">
    <!-- Item copier overlay: shared bezel and inset window, an item plate and its duplicate. -->

    <!-- Bezel ring: outer device frame, lit from the top-left. -->
    <rect x="2" y="2" width="12" height="12" fill="#3a313d" />
    <rect x="3" y="2" width="10" height="1" fill="#a59bb0" />
    <rect x="2" y="3" width="1" height="10" fill="#7b7185" />
    <rect x="13" y="3" width="1" height="10" fill="#2a222c" />
    <rect x="3" y="13" width="10" height="1" fill="#271e28" />

    <!-- Inset window: recessed panel that carries the machine colour. -->
    <rect x="4" y="4" width="8" height="8" fill="#6b577b" />
    <rect x="5" y="4" width="6" height="1" fill="#e3d1ff" />
    <rect x="4" y="5" width="1" height="6" fill="#c5ade8" />
    <rect x="11" y="5" width="1" height="6" fill="#533f5e" />
    <rect x="5" y="11" width="6" height="1" fill="#423149" />

    <!-- Glyph field: 6x6 machine mark. -->
    <rect x="5" y="5" width="3" height="3" fill="#fbf6ff" />
    <rect x="8" y="8" width="3" height="3" fill="#a28cd3" />

    <!-- Status strip: family-wide signature row. -->
    <rect x="3" y="14" width="2" height="1" fill="#e05b4d" />
    <rect x="7" y="14" width="2" height="1" fill="#f0bd4f" />
    <rect x="11" y="14" width="2" height="1" fill="#59d09d" />
</svg>
