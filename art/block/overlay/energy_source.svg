<svg xmlns="http://www.w3.org/2000/svg"
    width="16"
    height="16"
    viewBox="0 0 16 16"
    shape-rendering="crispEdges">
    <!-- Energy source overlay: shared bezel and inset window, a lightning bolt. -->

    <!-- Bezel ring: outer device frame, lit from the top-left. -->
    <rect x="2" y="2" width="12" height="12" fill="#373527" />
    <rect x="3" y="2" width="10" height="1" fill="#a7a08a" />
    <rect x="2" y="3" width="1" height="10" fill="#7d7661" />
    <rect x="13" y="3" width="1" height="10" fill="#272619" />
    <rect x="3" y="13" width="10" height="1" fill="#232216" />

    <!-- Inset window: recessed panel that carries the machine colour. -->
    <rect x="4" y="4" width="8" height="8" fill="#6b6037" />
    <rect x="5" y="4" width="6" height="1" fill="#efd8a1" />
    <rect x="4" y="5" width="1" height="6" fill="#d1b879" />
    <rect x="11" y="5" width="1" height="6" fill="#504822" />
    <rect x="5" y="11" width="6" height="1" fill="#3e3a1b" />

    <!-- Glyph field: 6x6 machine mark. -->
    <rect x="7" y="5" width="3" height="1" fill="#fcf8ea" />
    <rect x="6" y="6" width="3" height="1" fill="#fcf8ea" />
    <rect x="5" y="7" width="5" height="1" fill="#fcf8ea" />
    <rect x="6" y="8" width="1" height="1" fill="#fcf8ea" />
    <rect x="7" y="8" width="3" height="1" fill="#ba9448" />
    <rect x="7" y="9" width="2" height="1" fill="#ba9448" />
    <rect x="6" y="10" width="2" height="1" fill="#ba9448" />

    <!-- Status strip: family-wide signature row. -->
    <rect x="3" y="14" width="2" height="1" fill="#e05b4d" />
    <rect x="7" y="14" width="2" height="1" fill="#f0bd4f" />
    <rect x="11" y="14" width="2" height="1" fill="#59d09d" />
</svg>
