<svg xmlns="http://www.w3.org/2000/svg"
    width="16"
    height="16"
    viewBox="0 0 16 16"
    shape-rendering="crispEdges">
    <!-- Buffer overlay: shared bezel and inset window, four storage cells. -->

    <!-- Bezel ring: outer device frame, lit from the top-left. -->
    <rect x="2" y="2" width="12" height="12" fill="#303442" />
    <rect x="3" y="2" width="10" height="1" fill="#95a1b4" />
    <rect x="2" y="3" width="1" height="10" fill="#6b778a" />
    <rect x="13" y="3" width="1" height="10" fill="#212531" />
    <rect x="3" y="13" width="10" height="1" fill="#1e212c" />

    <!-- Inset window: recessed panel that carries the machine colour. -->
    <rect x="4" y="4" width="8" height="8" fill="#4d6183" />
    <rect x="5" y="4" width="6" height="1" fill="#c3ddff" />
    <rect x="4" y="5" width="1" height="6" fill="#95bdf1" />
    <rect x="11" y="5" width="1" height="6" fill="#394767" />
    <rect x="5" y="11" width="6" height="1" fill="#2e3852" />

    <!-- Glyph field: 6x6 machine mark. -->
    <rect x="5" y="5" width="2" height="1" fill="#f4f8ff" />
    <rect x="9" y="5" width="2" height="1" fill="#f4f8ff" />
    <rect x="5" y="6" width="2" height="1" fill="#659fd9" />
    <rect x="9" y="6" width="2" height="1" fill="#659fd9" />
    <rect x="5" y="9" width="2" height="1" fill="#f4f8ff" />
    <rect x="9" y="9" width="2" height="1" fill="#f4f8ff" />
    <rect x="5" y="10" width="2" height="1" fill="#659fd9" />
    <rect x="9" y="10" width="2" height="1" fill="#659fd9" />

    <!-- Status strip: family-wide signature row. -->
    <rect x="3" y="14" width="2" height="1" fill="#e05b4d" />
    <rect x="7" y="14" width="2" height="1" fill="#f0bd4f" />
    <rect x="11" y="14" width="2" height="1" fill="#59d09d" />
</svg>
