<svg xmlns="http://www.w3.org/2000/svg"
    width="16"
    height="16"
    viewBox="0 0 16 16"
    shape-rendering="crispEdges">
    <!-- Shaper overlay: a compact material piece is pressed into a broad plate. -->

    <!-- Bezel ring: outer device frame, lit from the top-left. -->
    <rect x="2" y="2" width="12" height="12" fill="#3d3526" />
    <rect x="3" y="2" width="10" height="1" fill="#b6a27f" />
    <rect x="2" y="3" width="1" height="10" fill="#887853" />
    <rect x="13" y="3" width="1" height="10" fill="#2d271b" />
    <rect x="3" y="13" width="10" height="1" fill="#282116" />

    <!-- Inset window: warm brass distinguishes shaping from storage and energy machines. -->
    <rect x="4" y="4" width="8" height="8" fill="#806a35" />
    <rect x="5" y="4" width="6" height="1" fill="#ffe2a0" />
    <rect x="4" y="5" width="1" height="6" fill="#d6aa55" />
    <rect x="11" y="5" width="1" height="6" fill="#5c4824" />
    <rect x="5" y="11" width="6" height="1" fill="#49391d" />

    <!-- Glyph field: a billet, a rightward press arrow, and the resulting plate. -->
    <rect x="5" y="6" width="2" height="3" fill="#fff8df" />
    <rect x="7" y="7" width="2" height="1" fill="#f2c96e" />
    <rect x="8" y="6" width="1" height="1" fill="#f2c96e" />
    <rect x="8" y="8" width="1" height="1" fill="#f2c96e" />
    <rect x="9" y="6" width="2" height="1" fill="#fff8df" />
    <rect x="9" y="7" width="2" height="2" fill="#c69743" />
    <rect x="6" y="10" width="5" height="1" fill="#7a5a2b" />

    <!-- Status strip: family-wide signature row. -->
    <rect x="3" y="14" width="2" height="1" fill="#e05b4d" />
    <rect x="7" y="14" width="2" height="1" fill="#f0bd4f" />
    <rect x="11" y="14" width="2" height="1" fill="#59d09d" />
</svg>
