  <rect x="3" y="12" width="10" height="1" fill="#364349"/>
  <rect x="13" y="5" width="1" height="7" fill="#354248"/>
  <rect x="3" y="5" width="10" height="7" fill="#46545a"/>

  <!-- Source item and duplicated result. -->
