<svg xmlns="http://www.w3.org/2000/svg"
     width="16"
     height="16"
     viewBox="0 0 16 16"
     shape-rendering="crispEdges">
  <!-- Transparent top-face overlay for machine_casing_base.svg. -->
  <defs>
    <pattern id="tray-grid"
             width="4"
             height="4"
             patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#485256"/>
      <path fill="#4b5559"
            d="M1 0h1v1H1zM2 1h1v1H2zM3 2h1v1H3zM0 3h1v1H0z"/>
      <path fill="#454f53"
            d="M2 0h1v1H2zM3 1h1v1H3zM0 2h1v1H0zM1 3h1v1H1z"/>
      <path fill="#4e585c"
            d="M3 0h1v1H3zM0 1h1v1H0zM1 2h1v1H1zM2 3h1v1H2z"/>
    </pattern>
  </defs>

  <!-- A uniformly bright ten-pixel tray, leaving the shared casing lip visible. -->
  <rect x="2" y="2" width="12" height="12" fill="#697579"/>
  <rect x="3" y="2" width="10" height="1" fill="#788488"/>
  <rect x="3" y="13" width="10" height="1" fill="#788488"/>
  <rect x="2" y="3" width="1" height="10" fill="#697579"/>
  <rect x="13" y="3" width="1" height="10" fill="#697579"/>
  <rect x="2" y="2" width="1" height="1" fill="#8b969a"/>
  <rect x="13" y="2" width="1" height="1" fill="#8b969a"/>
  <rect x="2" y="13" width="1" height="1" fill="#8b969a"/>
  <rect x="13" y="13" width="1" height="1" fill="#8b969a"/>
  <rect x="3" y="3" width="10" height="10" fill="url(#tray-grid)"/>

  <!-- North marker; the blockstate rotates this face with the machine. -->
  <rect x="6" y="2" width="2" height="1" fill="#4c7e54"/>
  <rect x="8" y="2" width="2" height="1" fill="#69b56f"/>
  <rect x="7" y="3" width="2" height="1" fill="#3d6944"/>
</svg>
