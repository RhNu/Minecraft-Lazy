<svg xmlns="http://www.w3.org/2000/svg"
     width="16"
     height="16"
     viewBox="0 0 16 16"
     shape-rendering="crispEdges">
  <!-- Source texture: a pocket teleporter built as a faceted jewel set in a microchip frame. -->

  <!-- Octagonal chip silhouette and lower-right shadow. -->
  <path fill="#171923"
        d="M5 1h6v1h2v2h1v8h-1v2h-2v1H5v-1H3v-2H2V4h1V2h2z"/>
  <path fill="#292943"
        d="M5 2h6v1h2v9h-2v2H5v-1H3V4h2z"/>

  <!-- Directional bevel, matching the hard one-pixel lighting used by the block sources. -->
  <rect x="5" y="2" width="6" height="1" fill="#72739a"/>
  <rect x="3" y="4" width="1" height="8" fill="#555677"/>
  <rect x="4" y="3" width="2" height="1" fill="#66678c"/>
  <rect x="11" y="3" width="2" height="1" fill="#393956"/>
  <rect x="12" y="4" width="1" height="8" fill="#22233a"/>
  <rect x="5" y="13" width="6" height="1" fill="#202135"/>
  <rect x="4" y="12" width="2" height="1" fill="#24253c"/>
  <rect x="10" y="12" width="2" height="1" fill="#1c1d31"/>

  <!-- Four metallic contacts make the jewel read as a compact device. -->
  <rect x="2" y="6" width="2" height="1" fill="#8b8ea7"/>
  <rect x="2" y="9" width="2" height="1" fill="#565a76"/>
  <rect x="12" y="6" width="2" height="1" fill="#555873"/>
  <rect x="12" y="9" width="2" height="1" fill="#353850"/>

  <!-- Recessed socket. -->
  <path fill="#121a2b"
        d="M6 3h4v1h2v2h1v4h-1v2h-2v1H6v-1H4v-2H3V6h1V5h2z"/>
  <path fill="#343459"
        d="M6 4h4v1h2v5h-1v2H6v-1H4V6h2z"/>

  <!-- Teleport crystal: cyan face with violet depth and discrete pixel facets. -->
  <path fill="#1a8eaa"
        d="M7 4h2v1h2v2h1v2h-1v2H9v1H7v-1H5V9H4V7h1V6h2z"/>
  <rect x="6" y="5" width="4" height="1" fill="#64e7e3"/>
  <rect x="5" y="6" width="3" height="3" fill="#37cbd1"/>
  <rect x="6" y="6" width="2" height="2" fill="#b8fff1"/>
  <rect x="8" y="6" width="3" height="1" fill="#25aebd"/>
  <rect x="8" y="7" width="3" height="3" fill="#388ebc"/>
  <rect x="5" y="9" width="3" height="1" fill="#268fac"/>
  <rect x="6" y="10" width="2" height="1" fill="#236a9c"/>
  <rect x="8" y="10" width="2" height="1" fill="#5b4ca5"/>
  <rect x="9" y="9" width="2" height="1" fill="#6755bd"/>

  <!-- A tiny specular spark keeps the core jewel-like at inventory scale. -->
  <rect x="6" y="6" width="1" height="1" fill="#e8fff7"/>
</svg>
