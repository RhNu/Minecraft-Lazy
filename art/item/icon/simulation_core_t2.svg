<svg xmlns="http://www.w3.org/2000/svg"
    width="16"
    height="16"
    viewBox="0 0 16 16"
    shape-rendering="crispEdges">
    <!-- Simulation core T2: gold frame, amber lens, 2/4 tier pips. -->

    <!-- Frame: shared core chassis in the tier metal. -->
    <path fill="#12171f" d="M3 2h10v1h1v10h-1v1H3v-1H2V3h1z" />
    <rect x="3" y="3" width="10" height="10" fill="#c99a2e" />
    <rect x="3" y="3" width="10" height="1" fill="#ffdc8c" />
    <rect x="3" y="4" width="1" height="8" fill="#e8bd55" />
    <rect x="12" y="4" width="1" height="8" fill="#8a6417" />
    <rect x="3" y="12" width="10" height="1" fill="#755212" />

    <!-- Lens bezel. -->
    <rect x="4" y="4" width="8" height="8" fill="#1b1407" />

    <!-- Lens field. -->
    <rect x="5" y="5" width="6" height="6" fill="#332204" />
    <rect x="5" y="5" width="6" height="1" fill="#96690d" />
    <rect x="5" y="6" width="1" height="4" fill="#473006" />
    <rect x="10" y="6" width="1" height="4" fill="#231702" />
    <rect x="5" y="10" width="6" height="1" fill="#1d1302" />

    <!-- Simulation mark: same plus glyph the chamber wears, in the tier colour. -->
    <rect x="7" y="6" width="2" height="1" fill="#ffe89b" />
    <rect x="6" y="7" width="1" height="2" fill="#ffd24a" />
    <rect x="7" y="7" width="2" height="2" fill="#fff6d0" />
    <rect x="9" y="7" width="1" height="2" fill="#ffd24a" />
    <rect x="7" y="9" width="2" height="1" fill="#b8860f" />

    <!-- Tier pips on the bezel lip: two of four lit. -->
    <rect x="6" y="11" width="4" height="1" fill="#5c4109" />
    <rect x="6" y="11" width="2" height="1" fill="#ffd24a" />
</svg>
