<svg xmlns="http://www.w3.org/2000/svg"
    width="16"
    height="16"
    viewBox="0 0 16 16"
    shape-rendering="crispEdges">
    <!-- Processing core T5: radiant End crystal frame, violet star lens, 5/5 tier pips. -->

    <!-- Frame: shared core chassis in an End-infused crystal alloy. -->
    <path fill="#11131d" d="M3 2h10v1h1v10h-1v1H3v-1H2V3h1z" />
    <rect x="3" y="3" width="10" height="10" fill="#7146a0" />
    <rect x="3" y="3" width="10" height="1" fill="#e1b9ff" />
    <rect x="3" y="4" width="1" height="8" fill="#aa75db" />
    <rect x="12" y="4" width="1" height="8" fill="#3c205c" />
    <rect x="3" y="12" width="10" height="1" fill="#29163f" />

    <!-- Lens bezel. -->
    <rect x="4" y="4" width="8" height="8" fill="#130b20" />

    <!-- Violet star lens field. -->
    <rect x="5" y="5" width="6" height="6" fill="#40156a" />
    <rect x="5" y="5" width="6" height="1" fill="#9255c9" />
    <rect x="5" y="6" width="1" height="4" fill="#672b9b" />
    <rect x="10" y="6" width="1" height="4" fill="#260d40" />
    <rect x="5" y="10" width="6" height="1" fill="#1d092f" />

    <!-- Simulation mark: a brilliant star-like plus glyph. -->
    <rect x="7" y="6" width="2" height="1" fill="#ebd5ff" />
    <rect x="6" y="7" width="1" height="2" fill="#cb8cff" />
    <rect x="7" y="7" width="2" height="2" fill="#ffffff" />
    <rect x="9" y="7" width="1" height="2" fill="#cb8cff" />
    <rect x="7" y="9" width="2" height="1" fill="#9a52d4" />

    <!-- Tier pips on the bezel lip: five of five lit. -->
    <rect x="5" y="11" width="1" height="1" fill="#c97fff" />
    <rect x="6" y="11" width="1" height="1" fill="#dfaaff" />
    <rect x="7" y="11" width="2" height="1" fill="#f2e9ff" />
    <rect x="9" y="11" width="1" height="1" fill="#dfaaff" />
    <rect x="10" y="11" width="1" height="1" fill="#c97fff" />
</svg>
