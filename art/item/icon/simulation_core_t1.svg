<svg xmlns="http://www.w3.org/2000/svg"
    width="16"
    height="16"
    viewBox="0 0 16 16"
    shape-rendering="crispEdges">
    <!-- Simulation core T1: copper frame, redstone lens, 1/4 tier pips. -->

    <!-- Frame: shared core chassis in the tier metal. -->
    <path fill="#12171f" d="M3 2h10v1h1v10h-1v1H3v-1H2V3h1z" />
    <rect x="3" y="3" width="10" height="10" fill="#b0663c" />
    <rect x="3" y="3" width="10" height="1" fill="#eeb488" />
    <rect x="3" y="4" width="1" height="8" fill="#d68f60" />
    <rect x="12" y="4" width="1" height="8" fill="#74401f" />
    <rect x="3" y="12" width="10" height="1" fill="#5e3319" />

    <!-- Lens bezel. -->
    <rect x="4" y="4" width="8" height="8" fill="#180e09" />

    <!-- Lens field. -->
    <rect x="5" y="5" width="6" height="6" fill="#3d1109" />
    <rect x="5" y="5" width="6" height="1" fill="#8f2f1e" />
    <rect x="5" y="6" width="1" height="4" fill="#521a0e" />
    <rect x="10" y="6" width="1" height="4" fill="#2b0b05" />
    <rect x="5" y="10" width="6" height="1" fill="#240905" />

    <!-- Simulation mark: same plus glyph the chamber wears, in the tier colour. -->
    <rect x="7" y="6" width="2" height="1" fill="#ffb894" />
    <rect x="6" y="7" width="1" height="2" fill="#ff7a4d" />
    <rect x="7" y="7" width="2" height="2" fill="#ffe3cf" />
    <rect x="9" y="7" width="1" height="2" fill="#ff7a4d" />
    <rect x="7" y="9" width="2" height="1" fill="#c0432c" />

    <!-- Tier pips on the bezel lip: one of four lit. -->
    <rect x="6" y="11" width="4" height="1" fill="#5e2415" />
    <rect x="6" y="11" width="1" height="1" fill="#ff7a4d" />
</svg>
