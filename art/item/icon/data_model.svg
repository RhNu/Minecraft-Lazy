    <rect x="5" y="8" width="4" height="1" fill="#c69cf0" />
    <rect x="5" y="9" width="4" height="1" fill="#8a55c8" />

    <!-- Family status lights. -->
    <rect x="11" y="5" width="2" height="6" fill="#252e35" />
    <rect x="11" y="6" width="2" height="1" fill="#59d09d" />
