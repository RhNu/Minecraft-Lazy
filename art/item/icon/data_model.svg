    <rect x="13" y="5" width="1" height="6" fill="#2b353d" />
    <rect x="2" y="11" width="12" height="1" fill="#212a31" />

    <!-- Display recess: violet variant of the shared screen treatment. -->
    <rect x="3" y="5" width="8" height="6" fill="#2b1848" />
    <rect x="3" y="5" width="8" height="1" fill="#5e3f95" />
    <rect x="3" y="6" width="1" height="4" fill="#4b3179" />
